// Use the build plugins supplied by the consuming React Native / Expo app.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["MappinteligencePlugin_" + name]).toInteger()
}

android {
  namespace "com.mappinteligenceplugin"
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // The consuming app's React Native Gradle plugin selects the matching version.
  implementation("com.facebook.react:react-android")

  implementation("androidx.annotation:annotation:1.9.1")
  implementation("androidx.core:core-ktx:1.16.0")
  implementation("androidx.appcompat:appcompat:1.7.0")
  implementation("com.mapp.sdk:intelligence-android:5.1.14")
}

react {
  jsRootDir = file("..")
  libraryName = "MappinteligencePlugin"
  codegenJavaPackageName = "com.mappinteligenceplugin"
}
